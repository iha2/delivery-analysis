[project]
name = "github-analysis"
version = "2.0.0"
description = "Delivery analytics: pull request, work item, and AI usage metrics for engineering leads"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn>=0.29",
    "tzdata>=2024.1; sys_platform == 'win32'",
    "tree-sitter>=0.23; python_version >= '3.10' and python_version < '3.15'",
    "tree-sitter-python>=0.23; python_version >= '3.10' and python_version < '3.15'",
    "tree-sitter-javascript>=0.23; python_version >= '3.10' and python_version < '3.15'",
    "tree-sitter-typescript>=0.23; python_version >= '3.10' and python_version < '3.15'",
    "tree-sitter-c-sharp>=0.23; python_version >= '3.10' and python_version < '3.15'",
    "tree-sitter-java>=0.23; python_version >= '3.10' and python_version < '3.15'",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1.0", "pyyaml>=6.0"]

[project.scripts]
delivery-analysis = "delivery_analysis.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["github_analysis", "delivery_analysis"]

[dependency-groups]
excel = ["openpyxl>=3.1.0", "pyyaml>=6.0"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
