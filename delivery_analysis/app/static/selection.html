<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selection · Delivery Analytics</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav id="nav">
    <h1>Delivery Analytics</h1>
    <a href="/">Dashboard</a>
    <a href="/rankings">Rankings</a>
    <a href="/selection">Selection</a>
    <a href="/teams">Teams</a>
    <a href="/sources">Sources</a>
    <a href="/settings">Settings</a>
    <a href="/ask">Ask</a>
  </nav>
  <div class="page">
    <header id="header"></header>
    <main id="content">
      <h2>Selection</h2>
      <p class="note">Repositories that are synced. Add one by workspace/slug, slug (with BITBUCKET_WORKSPACE set) or UUID; access is checked first.</p>
      <form id="add-repo" class="form-row">
        <input id="repo-input" placeholder="workspace/repository" aria-label="Repository" size="40">
        <button type="submit">Add repository</button>
        <span id="add-message" class="note"></span>
      </form>
      <div id="repo-list"></div>
      <p class="note">Jira projects are added here when the Jira connector lands.</p>
    </main>
  </div>
  <script src="/static/app.js"></script>
  <script src="/static/pages/selection.js"></script>
</body>
</html>
