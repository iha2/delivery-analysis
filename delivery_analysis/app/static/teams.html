<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teams · Delivery Analytics</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav id="nav">
    <h1>Delivery Analytics</h1>
    <a href="/">Dashboard</a>
    <a href="/rankings">Rankings</a>
    <a href="/selection">Selection</a>
    <a href="/teams">Teams</a>
    <a href="/sources">Sources</a>
    <a href="/settings">Settings</a>
    <a href="/ask">Ask</a>
  </nav>
  <div class="page">
    <header id="header"></header>
    <main id="content">
      <h2>Teams</h2>
      <div id="team-list"></div>
      <section class="card">
        <h3>Create a team</h3>
        <form id="create-team" class="form-row">
          <input id="team-name" placeholder="Team name" aria-label="Team name">
          <span id="team-repos"></span>
          <button type="submit">Create from these repositories</button>
          <span id="create-message" class="note"></span>
        </form>
      </section>
      <section class="card">
        <h3 id="members-title">Members</h3>
        <div id="team-members"></div>
        <div id="duplicates"></div>
      </section>
      <section class="card">
        <h3>Unmapped accounts</h3>
        <p class="note">Activity by these accounts is counted in an "Unmapped" row until you say who they are.</p>
        <div id="unmapped"></div>
      </section>
    </main>
  </div>
  <script src="/static/app.js"></script>
  <script src="/static/pages/teams.js"></script>
</body>
</html>
