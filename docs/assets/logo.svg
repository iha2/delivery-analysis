)</text><text x="106" y="329" fill="#f472b6" opacity="0.70">S(t) = Σ w(f), f ∈ files(t)  ·  V(p) = V(t) · S(p) / Σ S  ·  Impact per $ = Impact / cost</text><text x="84" y="346" fill="#a78bfa" opacity="0.85">F(t) = S(t) / median(S, 90d)  ·  credit = 0.05 · V(p) · r(f)  ·  Impact = Delivery + Participation</text><text x="128" y="363" fill="#38bdf8" opacity="1.00">V(t) = points × F(t)  ·  penalty = 0.005 · V(p) · r(f)  ·  w(f) = 1 + log2(1 + imports(f)) + root(f)</text><text x="106" y="380" fill="#34d399" opacity="0.55">V(p) = V(t) · S(p) / Σ S  ·  Impact per $ = Impact / cost  ·  r(f) = w(f) / median(w)</text></g>
